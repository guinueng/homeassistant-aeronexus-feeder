configuration:
  uuid:
    name: AeroNexus UUID
    description: >-
      AeroNexus에서 발급받은 36자 UUID를 입력하세요. 비워 두면 연결 없이 대기합니다.
      UUID 하나는 기기 하나에서만 사용하세요. 같은 UUID로 나중에 접속한 쪽은 서버가 끊습니다.
      라즈베리파이에서 이전할 때는 파이의 AeroNexus 피더를 먼저 제거하세요(기존 설치 명령 끝에 --uninstall).
      입력 후 저장하고 앱을 재시작하세요.
  beast_host:
    name: Beast 수신기 주소 (선택)
    description: >-
      비워 두면 기존 ADS-B Multi-Portal Feeder를 자동으로 찾습니다.
      직접 지정할 때는 앱의 내부 호스트명 또는 수신기 IP만 입력하세요.
      127.0.0.1은 이 AeroNexus 앱 자신을 가리킵니다.
  beast_port:
    name: Beast 출력 포트 (선택)
    description: 생략하면 30005입니다. 수신기 쪽 Beast 출력 포트를 지정합니다.
  filter:
    name: 전송 필터 (선택)
    description: >-
      기본 adsb는 DF17·18만 전송합니다. all은 진단용입니다.
      두 모드 모두 MLAT 표식이 있는 결과를 제외합니다.
  stats_interval:
    name: 통계 로그 간격 (선택)
    description: 초 단위입니다. 생략하면 60초, 설정 범위는 30~3600초입니다.
  refresh_upstream:
    name: 다음 시작 시 최신 중계기 받기
    description: >-
      켜고 저장한 뒤 앱을 재시작하면 앱 버전을 바꾸지 않아도 AeroNexus 공식 최신 코드를
      확인하고 검증 후 적용합니다. 확인 성공 시 자동으로 꺼집니다. 주기 확인은 하지 않습니다.
  update_interval:
    name: 이전 버전의 확인 간격 (사용하지 않음)
    description: >-
      1.1.0 설정 호환용이며 값은 무시합니다. 최초 실행과 앱 버전 업데이트 시 한 번만 확인하고,
      같은 버전의 재시작이나 실행 중에는 주기적으로 확인하지 않습니다.
