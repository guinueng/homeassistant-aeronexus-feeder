name: "AeroNexus Feeder"
version: "1.1.2"
slug: "aeronexus_feeder"
description: "Forward the existing ADS-B Multi-Portal Feeder Beast stream to AeroNexus"
url: "https://github.com/guinueng/homeassistant-aeronexus-feeder"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
timeout: 30
host_network: false
hassio_api: true
hassio_role: default
homeassistant_api: false
apparmor: true
backup: hot
options:
  uuid: ""
schema:
  uuid: "match(^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12})?$)"
  beast_host: "str?"
  beast_port: "port?"
  filter: "list(adsb|all)?"
  stats_interval: "int(30,3600)?"
  refresh_upstream: "bool?"
  # Retained only to accept options saved by 1.1.0. No periodic update check.
  update_interval: "int(300,86400)?"
